<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>點子牆｜廣告案例參考庫</title>
<meta name="description" content="廣告創意團隊在發想前翻閱的外部案例卡，可依產業、形式、手法、規格、調性與 AI 可行性篩選。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#grid">跳到案例列表</a>

<div id="bg" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <g class="d d-frame" data-speed="-60">
      <g transform="rotate(-5 1130 220)">
        <rect pathLength="1" x="940" y="110" width="400" height="225" rx="4"/>
        <path pathLength="1" d="M926 140v-30h30M1324 96h30v30M1354 320v30h-30M956 350h-30v-30" />
        <text x="952" y="132" class="mono" stroke="none" fill="currentColor">SC 01</text>
        <path pathLength="1" d="M1000 280c40-60 70-60 100-20s70 30 120-40" />
      </g>
    </g>
    <g class="d d-arrow" data-speed="-110">
      <path pathLength="1" d="M120 640c80-90 210-110 320-60 60 28 110 20 150-24" />
      <path pathLength="1" d="M560 520l34 38-50 12" />
    </g>
    <g class="d d-burst" data-speed="-40">
      <path pathLength="1" d="M300 190v-60M300 190l-45-42M300 190l45-42M300 190l-58 18M300 190l58 18" />
    </g>
    <g class="d d-squig" data-speed="-150">
      <path pathLength="1" d="M1010 700c20-34 40 34 60 0s40 34 60 0 40 34 60 0 40 34 60 0" />
    </g>
    <g class="d d-marks" data-speed="-20" stroke-width="1.5">
      <path pathLength="1" d="M64 64h24M76 52v24M1352 800h24M1364 788v24M700 60h24M712 48v24M64 820h24M76 808v24" />
    </g>
  </svg>
</div>

<header class="top">
  <a class="brand" href="./" aria-label="點子牆 首頁">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M7 8h6M7 12h3"/></svg>
    <span>點子牆</span>
  </a>
  <nav aria-label="頁面導覽">
    <a href="#cases">案例</a>
    <a href="#patterns">手法庫</a>
  </nav>
</header>

<section class="hero">
  <h1>開會前，先翻一輪<br class="br-d">別人做過的點子</h1>
  <p class="lede" id="lede">載入案例中…</p>
  <p class="meta" id="meta" aria-live="polite"></p>
</section>

<div class="layout" id="cases">
  <aside class="filters" id="filters" aria-label="篩選">
    <div class="filters-head">
      <h2>篩選</h2>
      <button type="button" class="link" id="clear-all" hidden>清除全部</button>
    </div>
    <div id="filter-groups"></div>
  </aside>

  <section class="results" aria-label="案例">
    <div class="toolbar">
      <label class="search">
        <span class="sr">搜尋標題與內文</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="q" type="search" placeholder="搜尋" autocomplete="off">
      </label>
      <button type="button" class="btn filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="filters">篩選<span id="filter-count"></span></button>
      <p class="count" id="count" aria-live="polite"></p>
    </div>
    <div class="grid" id="grid" aria-busy="true"></div>
    <div class="empty" id="empty" hidden>
      <p>沒有符合條件的案例</p>
      <button type="button" class="btn" id="empty-clear">清除篩選</button>
    </div>
  </section>
</div>

<section class="patterns" id="patterns" aria-labelledby="patterns-h">
  <div class="patterns-head">
    <h2 id="patterns-h">手法庫</h2>
    <p>從案例抽出來、可以換產業重複使用的梗的結構。案例會過時，手法不會。</p>
  </div>
  <div class="plist" id="plist"></div>
</section>

<footer class="foot">
  <p>由 <code>scripts/build.py</code> 從 <code>refs/*.md</code> 產生</p>
</footer>

<dialog id="dlg" aria-labelledby="dlg-title">
  <article class="sheet">
    <button type="button" class="close" id="dlg-close" aria-label="關閉">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 4l10 10M14 4 4 14"/></svg>
    </button>
    <div id="dlg-body"></div>
  </article>
</dialog>

<noscript><p class="noscript">此頁需要 JavaScript 才能載入案例。</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="app.js"></script>
</body>
</html>
